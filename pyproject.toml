[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "event-piv-multicut"
dynamic = ["version"]
description = "Event-basierte PIV: Partikel-Trajektorien aus Event-Kamera-Daten via Multicut (RAMA) mit gelernten Kantenkosten"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Devrim" }]

# NUR Pakete, die per pip aus PyPI kommen und nicht anders installiert werden.
# BEWUSST NICHT hier drin:
#   torch    -> braucht die --index-url seiner CUDA-Variante, siehe Kopf von
#               requirements-cluster.txt
#   rama_py  -> wird aus Git kompiliert
# Beide würden von pip sonst in falscher Variante nachinstalliert.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib",
    "h5py",
    "hdf5plugin",
    "pyyaml",
    "pillow",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.28",
]

[project.optional-dependencies]
dev = ["pytest"]

# Eine Zahl, eine Stelle: die Paketversion kommt aus src/eventpiv/__init__.py.
# Von dort holt config.build_meta sie als pkg_version in jedes Artefakt --
# stuenden beide getrennt, liefen sie beim ersten Hochzaehlen auseinander.
[tool.setuptools.dynamic]
version = { attr = "eventpiv.__version__" }
[tool.setuptools.packages.find]
where = ["src"]

# Lizenztext des vendored PSEELoader muss mit installiert werden
[tool.setuptools.package-data]
"eventpiv.psee_io" = ["LICENSE*", "NOTICE*", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "anker: Regressionsanker Stufe 1 auf dem ECHTEN Datensatz. Braucht $EVENTPIV_DATA, gebaute Label-Dateien und ein trainiertes Netz -- laeuft deshalb nicht in der normalen Suite.",
    "anker2: Regressionsanker Stufe 2, zusaetzlich mit Kandidatensatz und Stufe-2-Netz. Loest einen GANZEN Run -- deshalb ein eigener Marker.",
]
# Beide standardmaessig abgewaehlt. `pytest -m anker` bzw. `-m anker2`
# waehlt sie wieder an: die letzte -m-Angabe gewinnt.
addopts = "-m 'not anker and not anker2'"
