defaults:
  - pairs_schema
  - neighborhood: null
  # Kein `datensatz` hier: das Schema kennt `training` nicht, und der
  # Paarbau haengt nicht vom Netz ab. Einzelgruppen setzen:
  # neighborhood=stella pairsampling=stella
  - pairsampling: null
  - _self_

hydra:
  run:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/pairs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/pairs/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false