defaults:
  - solve_schema
  # Platzhalter: ohne Override ignoriert, also gelten die Vorgaben aus
  # runconfig.py. Mit `neighborhood=batch1` wird die Gruppe zugeschaltet.
  - neighborhood: null
  - pairsampling: null
  - training: null
  - datensatz: null
  - _self_

hydra:
  run:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/solve/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/solve/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false 