# Arbeitspunkt-Defaults kommen aus runconfig.py (SolveCfg), NICHT von hier --
# hier stehen nur Abweichungen und die Hydra-Einstellungen.
defaults:
  - solve_schema
  - _self_

hydra:
  run:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/solve/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/solve/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false 