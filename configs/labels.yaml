defaults:
  - labels_schema
  # Platzhalter: ohne Override ignoriert, also gelten die Vorgaben aus
  # runconfig.py. Mit `labeling=stella` wird die Gruppe zugeschaltet.
  - labeling: null
  - _self_

hydra:
  run:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/labels/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/labels/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false