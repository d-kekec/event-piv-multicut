defaults:
  - solve_schema
  - neighborhood: null
  - pairsampling: null
  - training: null
  - datensatz: null
  - _self_

# Der Treiber schreitet den GANZEN Run ab. Ohne diese Zeilen griffe das
# Vorgabefenster aus runconfig.Window, und der Lauf loeste nur diesen
# Ausschnitt -- ohne Fehlermeldung.
window:
  t0: null
  dt: null

hydra:
  run:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/tracklets/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/tracklets/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false