defaults:
  - solve_schema
  - neighborhood: null
  - _self_

# Der Treiber schreitet den GANZEN Run ab. Ohne diese beiden Zeilen griffen
# die Vorgaben von Window (t0 = 1,7 s, dt = 20 ms), und der Lauf umfasste
# ZWEI Fenster statt achthundert -- ohne Fehlermeldung, mit plausibel
# aussehenden Zahlen.
window:
  t0: null
  dt: null

hydra:
  run:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/tracklets/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:EVENTPIV_OUT}/hydra/tracklets/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false