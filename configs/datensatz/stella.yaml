# @package _global_
#
# STELLA ab dem Training [3]: setzt neighborhood, pairsampling und training
# auf stella, also auf die Vorgaben aus kern/runconfig.py; so ist STELLA
# wie batch1 mit einem Wort waehlbar. Labels [1] und Paarbau [2]
# nehmen die Einzelgruppen, ihre Treiber kennen `datensatz` nicht.
# kandidatensatz, transformersatz und fitsatz setzt es nicht; sie kommen ab
# [6a], [6b] und [7] einzeln dazu.
defaults:
  - override /neighborhood: stella
  - override /pairsampling: stella
  - override /training: stella